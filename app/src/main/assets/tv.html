<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambilight Lampen</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<style>
html,body{height:100%;overflow:hidden;transition:background .6s}
body.night{background:#0e0814}
.wrap{display:flex;height:100vh;gap:3vw;padding:4vh 3vw;align-items:center}
.stage{flex:1;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
#map{image-rendering:pixelated;border:4px solid #120a16;box-shadow:0 0 0 3px #3b2240,0 10px 30px rgba(0,0,0,.5)}
.side{width:31vw;max-height:92vh;display:flex;flex-direction:column;gap:0}
.side .panel{margin-top:0;margin-bottom:1.4vh;padding:14px 16px}
h1{margin:0;font-size:2.8vh;font-weight:700}
.stat{display:flex;align-items:center;gap:.8vw;font-size:1.9vh;margin-top:.4vh}
.stat i{width:1.2vh;height:1.2vh;background:#8a7a6a;border:2px solid var(--ink);display:inline-block}
.stat i.on{background:#5fb85a}.stat i.warn{background:#e0a040}.stat i.off{background:#c0503a}
.btns{display:flex;flex-direction:column;gap:.8vh;margin-top:1.2vh}
.btns .btn{font-size:2vh;padding:.7vh .9vw;text-align:left}
.legend{display:flex;flex-direction:column;gap:.6vh;margin-top:1.2vh;font-size:2vh}
.legend{display:grid!important;grid-template-columns:1fr 1fr;gap:.6vh .5vw!important}
.legend .hint{grid-column:1/-1}
.legend .btn{display:flex;align-items:center;gap:.6vw;font-size:1.8vh;padding:.5vh .6vw;text-align:left;overflow:hidden;white-space:nowrap}
.legend .hint{font-size:1.6vh;opacity:.7}
.legend span.sq{width:1.8vh;height:1.8vh;border:2px solid var(--ink);display:inline-block}
.qr{display:flex;gap:1.2vw;align-items:center}
.qr img{width:12vh;height:12vh;image-rendering:pixelated;border:3px solid var(--ink);background:#fff;padding:4px}
.qr p{font-size:1.9vh;margin:0}
#rainbow{position:fixed;inset:0;overflow:hidden;z-index:9;background:#000}
#rainbow .spin{position:absolute;left:50%;top:50%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;
  background:conic-gradient(#ff0000,#ff8800,#ffee00,#33ff00,#00ffcc,#0066ff,#8800ff,#ff00aa,#ff0000);animation:spin var(--speed,8s) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#rainbow .inner{position:absolute;inset:16vh 16vw;background:#1d1124;border:4px solid #120a16;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;color:var(--cream);text-align:center;padding:2vh}
#rainbow .inner h2{font-size:2.8vh;margin:0}
#rainbow .inner p{font-size:1.8vh;margin:0;opacity:.85}
#rbStage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#rbMap{image-rendering:pixelated}
#settings{position:fixed;inset:0;background:rgba(14,8,20,.72);display:flex;align-items:center;justify-content:center;z-index:8}
#settings .panel{width:58vw;margin:0}
#settings h2{font-size:3vh;margin:0 0 1.4vh}
.srow{padding:1vh 1.2vw;margin-bottom:.8vh;border:3px solid transparent}
.srow.focus{background:var(--gold);border-color:var(--ink)}
.srow .top{display:flex;justify-content:space-between;font-size:2.2vh;font-weight:600}
.srow .bar{display:flex;gap:3px;margin-top:.7vh;height:1.3vh}
.srow .bar i{flex:1;background:var(--parch-dk);border:2px solid var(--ink)}
.srow .bar i.on{background:var(--wood-dk)}
.srow .arrows{opacity:.6;font-size:1.8vh}
.shint{font-size:1.7vh;opacity:.75;margin-top:1vh}
.qr small{display:block;margin-top:.6vh;font-size:1.6vh;opacity:.75;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage"><canvas id="map"></canvas></div>
  <div class="side">
    <section class="panel">
      <h1>Ambilight Lampen</h1>
      <div class="stat"><i id="iSync"></i><span id="tSync"></span></div>
      <div class="stat"><i id="iTv"></i><span id="tTv"></span></div>
      <div class="stat"><i id="iLamps"></i><span id="tLamps"></span></div>
      <div class="btns">
        <button class="btn gold" id="syncBtn">Sync starten</button>
        <button class="btn" id="testBtn">Kleurtest (alle lampen na elkaar)</button>
        <button class="btn" id="rainbowBtn">Testbeeld (regenboog)</button>
        <button class="btn" id="setBtn">Instellingen</button>
        <button class="btn gold hidden" id="updBtn">Update</button>
        <div class="shint" id="ver"></div>
      </div>
      <div class="legend" id="legend"></div>
    </section>
    <section class="panel">
      <div class="qr"><img id="qr" alt=""><div><p>Kamer inrichten en lampen ophangen: scan met je telefoon</p><small id="url"></small></div></div>
    </section>
  </div>
</div>
<div id="rainbow" class="hidden"><div class="spin"></div><div class="inner">
  <h2>Testbeeld</h2>
  <div id="rbStage"><canvas id="rbMap"></canvas></div>
  <p id="rbHint"></p>
  <p id="rbSpeed"></p>
</div></div>
<div id="settings" class="hidden"><section class="panel">
  <h2>Instellingen</h2>
  <div id="srows"></div>
  <div class="shint">Omhoog en omlaag: kiezen. Links en rechts: aanpassen. OK: aan of uit. Terug: sluiten.</div>
</section></div>
<div id="upd" class="hidden" style="position:fixed;inset:0;background:rgba(14,8,20,.72);display:flex;align-items:center;justify-content:center;z-index:10">
<section class="panel" style="width:48vw;margin:0">
  <h2 id="updTitle" style="font-size:3vh;margin:0 0 1.2vh"></h2>
  <div id="updNotes" style="font-size:2.1vh;max-height:46vh;overflow:auto"></div>
  <div class="row" style="margin-top:2vh;gap:1vw"><button class="btn gold" id="updGo" style="font-size:2.3vh">Nu updaten</button><button class="btn" id="updLater" style="font-size:2.3vh">Later</button></div>
</section></div>
<div id="toast"></div>
<script src="/i18n.js"></script>
<script src="/room.js"></script>
<script>
const $=id=>document.getElementById(id);
let S=null,L=null,baseImg=null,baseKey='',busy=false,langDone=false;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
async function api(p,b){const r=await fetch(p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return r.json()}

function render(){
  if(!S)return;
  L=Room.migrate(S.layout);
  const key=JSON.stringify(L)+JSON.stringify(S.lamps.map(l=>[l.x,l.y,l.height]));
  if(key!==baseKey){baseImg=Room.base(L,S.lamps);baseKey=key}
  const live={};for(const l of S.lamps)live[l.id]=l;
  const img=Room.frame(baseImg,L,S.lamps,live,S.sync,S.top);
  const st=$('stage');Room.present($('map'),img,st.clientWidth-14,st.clientHeight-14,true);
}
function status(){
  const s=S,on=s.lamps.filter(l=>l.online).length,placed=s.lamps.filter(l=>l.x>=0).length;
  document.body.classList.toggle('night',s.sync);
  $('iSync').className=s.sync?'on':'';$('tSync').textContent='Sync: '+t(s.sync?'aan':'uit');
  $('iTv').className=!s.tv.paired?'off':(s.sync&&s.tv.status!=='Verbonden'?'warn':'on');
  $('tTv').textContent=t('Tv')+': '+(!s.tv.paired?t('nog niet gekoppeld'):s.sync?t(s.tv.status).toLowerCase():t('gekoppeld'));
  $('iLamps').className=!s.lamps.length?'off':on===s.lamps.length?'on':'warn';
  $('tLamps').textContent=s.lamps.length?t('Lampen: {a} van {b} bereikbaar',{a:on,b:s.lamps.length}):t('Nog geen lampen, voeg ze toe via de telefoon');
  $('syncBtn').textContent=t(s.sync?'Sync stoppen':'Sync starten');
  const ids=s.lamps.map(l=>l.id+l.name+(l.x<0)).join();
  if($('legend').dataset.ids!==ids){
    $('legend').dataset.ids=ids;
    $('legend').innerHTML='<div class="hint">'+t('OK op een lamp laat hem knipperen')+'</div>'+s.lamps.map(l=>`<button class="btn lamp" data-id="${l.id}"><span class="sq"></span>${l.name}${l.x<0?t(' (nog ophangen)'):''}</button>`).join('');
    $('legend').querySelectorAll('.lamp').forEach(b=>{
      b.onclick=async()=>toast((await api('/api/identify',{id:b.dataset.id})).message);
      b.addEventListener('focus',()=>b.classList.add('focus'));b.addEventListener('blur',()=>b.classList.remove('focus'));
    });
  }
  for(const b of $('legend').querySelectorAll('.lamp')){const l=s.lamps.find(x=>x.id===b.dataset.id);if(l)b.querySelector('.sq').style.background=l.online?(l.color&&l.color!=='#555555'?l.color:'#ffd696'):'#6a6070'}
  if(s.update){const u=s.update;$('updBtn').classList.toggle('hidden',!u.available);$('updBtn').textContent=t('Update naar {v}',{v:u.latest});
    $('ver').textContent=t('Versie {v}',{v:u.current})+(u.status?' | '+u.status:'')}
  if(s.link&&$('url').textContent!==s.link){$('url').textContent=s.link;$('qr').src='/qr.png?'+encodeURIComponent(s.link)}
}
async function poll(){
  try{S=await api('/api/state');if(!langDone){langDone=true;I18N.set(S.settings.lang);I18N.apply()}status();render();rbRender()}catch(e){}
  setTimeout(poll,S&&S.sync?150:500);
}
$('syncBtn').onclick=async()=>{if(busy)return;busy=true;const on=!(S&&S.sync);toast(t(on?'Sync start...':'Sync stopt...'));await api('/api/sync',{on});busy=false};
$('testBtn').onclick=async()=>toast((await api('/api/test',{})).message);

// Instellingen met de afstandsbediening
const ROWS=[
  {k:'smooth',label:'Reactiesnelheid',min:0.08,max:1,step:0.04,fmt:v=>Math.round(v*100)+'%'},
  {k:'saturation',label:'Kleurintensiteit',min:0.8,max:2.6,step:0.1,fmt:v=>v.toFixed(1)+'x'},
  {k:'brightness',label:'Helderheid',min:0.5,max:2.6,step:0.1,fmt:v=>v.toFixed(1)+'x'},
  {k:'minLight',label:'Licht bij zwart beeld',min:0,max:0.3,step:0.01,fmt:v=>v<0.005?t('uit'):Math.round(v*100)+'%'},
  {k:'spread',label:'Hoe breed lampen meekijken',min:0.4,max:2.5,step:0.1,fmt:v=>v.toFixed(1)+'x'},
  {k:'after',label:'Na stoppen',options:[['restore','Terug naar hoe ze stonden'],['white','Warm wit'],['off','Uit']]},
  {k:'autostart',label:'Automatisch starten als de tv aangaat',bool:true},
  {k:'lang',label:'Taal',options:[['nl','Nederlands'],['en','English']],reload:true,raw:true},
];
let setOpen=false,setIdx=0,setVals=null,setTimer=null;
function openSettings(){if(!S)return;setVals={...S.settings};setOpen=true;setIdx=0;$('settings').classList.remove('hidden');renderSettings()}
function closeSettings(){setOpen=false;$('settings').classList.add('hidden');$('setBtn').focus()}
let rbOpen=false,rbStartedSync=false,rbSpeed=8,rbSel=-1,rbSave=null,rbLamps=null;
function rbHint(){
  const l=rbLamps&&rbLamps[rbSel];
  $('rbHint').textContent=l?t('"{n}" gekozen: pijltjes schuiven hem 25 cm, OK kiest de volgende lamp.',{n:l.name})
    :t('Kijk of de kleur in dezelfde richting langs je lampen draait. OK: lamp kiezen om te verschuiven. Links/rechts: snelheid. Terug: stoppen.');
}
function rbRender(){
  if(!rbOpen||!S)return;
  const lamps=S.lamps.map(l=>{const m=rbLamps&&rbLamps.find(x=>x.id===l.id);return m?{...l,x:m.x,y:m.y}:l});
  const Lr=Room.migrate(S.layout),base=Room.base(Lr,lamps),live={};for(const l of S.lamps)live[l.id]=l;
  const img=Room.frame(base,Lr,lamps,live,S.sync,S.top),st=$('rbStage');
  const v=Room.present($('rbMap'),img,st.clientWidth,st.clientHeight,true);
  const l=rbLamps&&rbLamps[rbSel];
  if(l&&l.x>=0){const k=v.scale,x=(l.x+1)*k,y=(l.y+1)*k;v.g.strokeStyle='#ffe08a';v.g.lineWidth=3;v.g.strokeRect(x-k*.32,y-k*.32,k*.64,k*.64)}
}
function rbMove(dx,dy){
  const l=rbLamps[rbSel];if(!l)return;
  if(l.x<0){l.x=(S.layout.tv?S.layout.tv.x:1);l.y=(S.layout.tv?S.layout.tv.y+1:1)}
  l.x=Math.max(0,Math.min(S.layout.w,Math.round((l.x+dx)*4)/4));l.y=Math.max(0,Math.min(S.layout.h,Math.round((l.y+dy)*4)/4));
  rbRender();clearTimeout(rbSave);
  rbSave=setTimeout(()=>api('/api/save',{lamps:rbLamps.map(x=>({id:x.id,x:x.x,y:x.y}))}),300);
}
async function openRainbow(){
  rbOpen=true;rbSel=-1;rbLamps=S?S.lamps.map(l=>({id:l.id,name:l.name,x:l.x,y:l.y})):[];
  $('rainbow').classList.remove('hidden');speedRb(0);rbHint();setTimeout(rbRender,50);
  if(S&&!S.sync){rbStartedSync=true;await api('/api/sync',{on:true})}else rbStartedSync=false;
}
async function closeRainbow(){
  rbOpen=false;$('rainbow').classList.add('hidden');$('rainbowBtn').focus();
  if(rbStartedSync){rbStartedSync=false;await api('/api/sync',{on:false})}
}
function speedRb(d){rbSpeed=Math.min(30,Math.max(2,rbSpeed+d));$('rainbow').style.setProperty('--speed',rbSpeed+'s');$('rbSpeed').textContent=t('Eén rondje per {n} seconden',{n:rbSpeed})}
$('rainbowBtn').onclick=openRainbow;
document.addEventListener('keydown',e=>{
  if(!rbOpen)return;
  const sel=rbLamps&&rbLamps[rbSel];
  if(e.key==='Enter'){rbSel=rbSel+1>=rbLamps.length?-1:rbSel+1;rbHint();rbRender()}
  else if(sel&&e.key==='ArrowLeft')rbMove(-0.25,0);else if(sel&&e.key==='ArrowRight')rbMove(0.25,0);
  else if(sel&&e.key==='ArrowUp')rbMove(0,-0.25);else if(sel&&e.key==='ArrowDown')rbMove(0,0.25);
  else if(e.key==='ArrowLeft')speedRb(1);else if(e.key==='ArrowRight')speedRb(-1);
  else if(e.key==='Escape'||e.key==='Backspace')closeRainbow();
  e.preventDefault();e.stopImmediatePropagation();
},true);
window.onBack=()=>{if(rbOpen){closeRainbow();return true}if(setOpen){closeSettings();return true}return false};
function renderSettings(){
  $('srows').innerHTML=ROWS.map((r,i)=>{
    const v=setVals[r.k];let val,bar='';
    if(r.bool)val=t(v?'aan':'uit');
    else if(r.options){const o=(r.options.find(o=>o[0]===v)||r.options[0])[1];val=r.raw?o:t(o)}
    else{val=r.fmt(+v);const n=20,f=Math.round((v-r.min)/(r.max-r.min)*n);bar='<div class="bar">'+Array.from({length:n},(_,j)=>`<i class="${j<f?'on':''}"></i>`).join('')+'</div>'}
    return `<div class="srow${i===setIdx?' focus':''}"><div class="top"><span>${t(r.label)}</span><span><span class="arrows">${r.bool?'OK ':'&lt; '}</span>${val}<span class="arrows">${r.bool?'':' &gt;'}</span></span></div>${bar}</div>`}).join('');
}
function changeSetting(dir){
  const r=ROWS[setIdx];
  if(r.bool)setVals[r.k]=!setVals[r.k];
  else if(r.options){const i=r.options.findIndex(o=>o[0]===setVals[r.k]);setVals[r.k]=r.options[(i+dir+r.options.length)%r.options.length][0]}
  else setVals[r.k]=Math.round(Math.min(r.max,Math.max(r.min,+setVals[r.k]+dir*r.step))*100)/100;
  renderSettings();clearTimeout(setTimer);
  setTimer=setTimeout(async()=>{const res=await api('/api/save',{settings:setVals});if(!res.ok)toast(res.message);else if(r.reload)location.reload()},r.reload?50:350);
}
$('setBtn').onclick=openSettings;
$('updBtn').onclick=openUpd;
let updOpen=false;
function openUpd(){if(!S||!S.update)return;updOpen=true;const u=S.update;
  $('updTitle').textContent=t('Wat is er nieuw in {v}',{v:u.latest});
  const lines=I18N.notes(u.notes);
  $('updNotes').innerHTML=lines.length?'<ul>'+lines.map(l=>'<li></li>').join('')+'</ul>':'<p>'+t('Geen beschrijving.')+'</p>';
  $('updNotes').querySelectorAll('li').forEach((li,i)=>li.textContent=lines[i]);
  $('upd').classList.remove('hidden');$('updGo').focus()}
function closeUpd(){updOpen=false;$('upd').classList.add('hidden');$('updBtn').focus()}
$('updGo').onclick=async()=>{toast((await api('/api/update',{})).message);closeUpd()};
$('updLater').onclick=closeUpd;
document.addEventListener('keydown',e=>{
  if(!updOpen)return;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'){(document.activeElement===$('updGo')?$('updLater'):$('updGo')).focus();e.preventDefault();e.stopImmediatePropagation()}
  else if(e.key==='Escape'||e.key==='Backspace'){closeUpd();e.preventDefault();e.stopImmediatePropagation()}
},true);
const _ob=window.onBack;window.onBack=()=>{if(updOpen){closeUpd();return true}return _ob?_ob():false};
document.addEventListener('keydown',e=>{
  if(!setOpen)return;
  if(e.key==='ArrowDown'){setIdx=(setIdx+1)%ROWS.length;renderSettings()}
  else if(e.key==='ArrowUp'){setIdx=(setIdx-1+ROWS.length)%ROWS.length;renderSettings()}
  else if(e.key==='ArrowRight')changeSetting(1);
  else if(e.key==='ArrowLeft')changeSetting(-1);
  else if(e.key==='Enter'){const r=ROWS[setIdx];if(r.bool||r.options)changeSetting(1)}
  else if(e.key==='Escape'||e.key==='Backspace')closeSettings();
  else return;
  e.preventDefault();e.stopImmediatePropagation();
},true);

// Afstandsbediening: pijltjes wisselen tussen de knoppen, OK drukt
const btns=()=>[...document.querySelectorAll('.btns .btn:not(.hidden), .legend .btn')];
document.addEventListener('keydown',e=>{
  const b=btns(),i=b.indexOf(document.activeElement);
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){b[(i+1+b.length)%b.length].focus();e.preventDefault()}
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){b[(i-1+b.length)%b.length].focus();e.preventDefault()}
});
btns().forEach(b=>{b.addEventListener('focus',()=>b.classList.add('focus'));b.addEventListener('blur',()=>b.classList.remove('focus'))});
$('syncBtn').focus();
window.addEventListener('resize',render);
document.fonts&&document.fonts.ready.then(render);
poll();
</script>
</body>
</html>
